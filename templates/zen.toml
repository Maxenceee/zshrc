version = 3
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }}'

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    background = 'transparent'
    foreground = 'blue'
    template = '{{ .Path }}'

    [blocks.segments.properties]
      style = 'full'

  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    background = 'transparent'
    foreground = 'p:grey'
    template = ' {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} <cyan>{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead  0}}⇡{{ end }}</>'

    [blocks.segments.properties]
      branch_icon = ''
      fetch_status = true
      commit_icon = '@'

[[blocks]]
  type ='prompt'
  alignment = 'right'
  overflow = 'hidden'

  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    background = 'transparent'
    foreground = 'yellow'
    template = '{{ .FormattedMs }}'

    [blocks.segments.properties]
      threshold = 5000

  [[blocks.segments]]
    type = 'python'
    style = 'plain'
    background = 'transparent'
    foreground = 'p:python'
    template = '  {{ if .Venv }}({{ .Venv }}) {{ end }}{{ .Full }}'

    [blocks.segments.properties]
      display_mode = 'context'

  [[blocks.segments]]
    type = 'node'
    style = 'plain'
    background = 'transparent'
    foreground = '#68A063'
    template = '  {{ .Full }}'

    [blocks.segments.properties]
      display_mode = 'context'

  [[blocks.segments]]
    type = "session"
    style = 'plain'
    background = 'transparent'
    template = ' {{ if .SSHSession }}{{ .UserName }}@{{ .HostName }}{{ end }}'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    background = 'transparent'
    foreground_templates = [
      "{{if gt .Code 0}}red{{end}}",
      "{{if eq .Code 0}}magenta{{end}}",
    ]
    template = '❯'

[transient_prompt]
  background = 'transparent'
  foreground_templates = [
    "{{if gt .Code 0}}red{{end}}",
    "{{if eq .Code 0}}magenta{{end}}",
  ]
  template = '❯ '

[secondary_prompt]
  foreground = 'magenta'
  background = 'transparent'
  template = '❯ '

[[tooltips]]
  type = 'docker'
  tips = [ 'docker' ]
  style = 'plain'
  background = "transparent"
  foreground = "p:docker"
  template = ' {{ .Context }}'

[palette]
grey = 'darkGray'
docker = '#0B59E7'
python = '#3776AB'
node = '#68A063'

